name: contract-tests

on:
  pull_request:
  push:
    branches:
      - workspace-intake-guardrails-v0.4.0

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run workflow contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
